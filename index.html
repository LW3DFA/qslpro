// =====================================
//         VERIFICA LOGIN GMAIL 
// =====================================

function verificarLoginGoogle(){

    // 1. Capturar tokens si vienen desde la URL tras redirigir del login
    const urlParams = new URLSearchParams(window.location.search);
    const tokenUrl = urlParams.get('access_token');
    const refreshTokenUrl = urlParams.get('refresh_token');

    if (tokenUrl) {
        localStorage.setItem('gmail_access_token', tokenUrl);
        if (refreshTokenUrl) {
            localStorage.setItem('gmail_refresh_token', refreshTokenUrl);
        }
        // Limpiar parámetros de la URL para mantenerla limpia
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // 2. Comprobar si existe un token en localStorage
    const token = localStorage.getItem('gmail_access_token');

    if(token && token !== "undefined" && token !== "null"){

        document.getElementById('estadoLogin').innerHTML = '✅ Gmail conectado correctamente';
        document.getElementById('estadoLogin').style.background = '#28a745';

        return true;
    }

    // 3. Si no hay token guardado
    document.getElementById('estadoLogin').innerHTML = '🔒 Debe conectarse con Gmail para utilizar el sistema';
    document.getElementById('estadoLogin').style.background = '#dc3545';

    return false;
}
// =====================================
//            ACCESO PERMITIDO 
// =====================================
function accesoPermitido(){

    const token =
    localStorage.getItem(
        'gmail_access_token'
    );

    if(!token){

        alert(
            '⚠ Debe conectarse con Gmail antes de utilizar QSL PRO HD'
        );

        return false;
    }

    return true;
}

// =====================================
//      CONFIGURACIÓN GMAIL USUARIO
// =====================================

async function loginGoogle(){

    try{

        const response =
        await fetch(
            '/.netlify/functions/google-auth'
        );

        const data =
        await response.json();

        if(data.url){

            window.location.href =
            data.url;
        }

    }catch(error){

        console.log(
            "Error Google Login:",
            error
        );

        alert(
            "Error iniciando Google"
        );
    }
}


// =====================================
//        CONFIGURACIÓN CANVAS
// =====================================

const canvas = document.getElementById('qslcanvas');

const ctx = canvas.getContext('2d');

ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

// =====================================
//         RESOLUCIÓN FINAL QSL
// =====================================

const QSL_WIDTH = 1920;
const QSL_HEIGHT = 1080;

// =====================================
//            IMAGEN FONDO
// =====================================

let baseImage = new Image();

// =====================================
//        MEMBRETE PNG TRANSPARENTE
// =====================================

let membrete = new Image();

let membreteCargado = false;

membrete.onload = function (){

    membreteCargado = true;

    console.log("Membrete cargado OK");
    };

// IMPORTANTE:
// membrete.png debe estar
// en la misma carpeta del HTML

 membrete.src = "membrete.png";

// =====================================
//        CARGAR IMAGEN DE FONDO
// =====================================

document.getElementById('imageLoader').addEventListener('change', function(e){

	 if(!accesoPermitido()){
        this.value = '';
        return;
    }
	
    const file = e.target.files[0];

    if(!file){
        alert("No se seleccionó imagen");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event){

        baseImage = new Image();

        baseImage.onload = function(){

            document.getElementById("placeholderText").style.display = "none";

            ctx.clearRect(0,0,canvas.width,canvas.height);

            ctx.drawImage(
                baseImage,
                0,
                0,
                canvas.width,
                canvas.height
            );

            if(membreteCargado){

                ctx.drawImage(
                    membrete,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );
            }

            console.log("Imagen cargada correctamente");
        };

        baseImage.onerror = function(){
            alert("Error cargando la imagen");
        };

        baseImage.src = event.target.result;
    };

    reader.readAsDataURL(file);
});

// =====================================
//             GENERAR QSL
// =====================================

function generar(){

if(!accesoPermitido()) return;

    // VERIFICAR IMAGEN

    if(!baseImage.src){

        alert("Primero cargá una imagen");

        return;
    }

    // LIMPIAR

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // FONDO

    ctx.drawImage(
        baseImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    // MEMBRETE

    if(membreteCargado){

        ctx.drawImage(
            membrete,
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    // =====================================
    //        CONFIGURACIÓN TEXTO
    // =====================================

    ctx.fillStyle = '#0E5C9A';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 24px Arial';

    // =====================================
    //           POSICIONES TEXTO
    // =====================================

    // MI SD

    ctx.fillText(
        document.getElementById('STATION_CALLSIGN').value || '', 1227, 938
    );
	
	// REFERENCIA

    ctx.fillText(
        document.getElementById('COMMENT').value || '', 1640, 938
    );
	
	// CALL

    ctx.fillText(
        document.getElementById('qso').value || '', 1207, 1043
    );

    // FECHA

    ctx.fillText(
        document.getElementById('day').value || '', 1296, 1043
    );

    ctx.fillText(
        document.getElementById('month').value || '', 1325, 1043
    );

    ctx.fillText(
        document.getElementById('year').value || '', 1364, 1043
    );

    // UTC

    ctx.fillText(
        document.getElementById('utc').value || '', 1444, 1043
    );

    // MHz

    ctx.fillText(
        document.getElementById('mhz').value || '', 1548, 1043
    );

    // MODO

    ctx.fillText(
        document.getElementById('modo').value || '', 1659, 1043
    );

    // RST

    ctx.fillText(
        document.getElementById('rst').value || '', 1765, 1043
    );

    // QSL

    ctx.font = 'bold 24px Arial';

    ctx.fillText(
        document.getElementById('qsl').value || '', 1850, 1043
    );
}

// =====================================
//          BUSCA EMAIL EN QRZ
// =====================================

async function buscarEmailQRZ(callsign){

    try{

        const response =
        await fetch(
            `/.netlify/functions/qrz?call=${callsign}`
        );

        const data =
        await response.json();

        console.log(
            'QRZ DATA:',
            data
        );

        return data.email || '';

    }catch(error){

        console.log(
            'Error QRZ:',
            error
        );

        return '';
    }
}
// =========================
//      CONTADOR QSL
// =========================

let contadorEnviadas = 0;

function actualizarContadorQSL(finalizado = false){

    const contador =
    document.getElementById(
    'contadorQSL'
    );

    if(finalizado){

        contador.style.background =
        '#43a047';

        contador.innerText =
        `${contadorEnviadas} QSL enviadas ✔`;

        return;
    }

    contadorEnviadas++;

    contador.style.background =
    '#1e88e5';

    contador.innerText =
    `${contadorEnviadas} QSL enviadas`;
}
// =====================================
//              LEER ADIF
// =====================================

async function procesarADIF(){
contadorEnviadas = 0;

if(!accesoPermitido()) return;

const contador =
document.getElementById(
'contadorQSL'
);

contador.style.background =
'#1e88e5';

contador.innerText =
'Iniciando envío...';

    const fileInput =
    document.getElementById('adifFile');

    if(!fileInput.files.length){

        alert("Seleccione un archivo ADIF");

        return;
    }

    const file = fileInput.files[0];

    const texto = await file.text();

    const registros = texto.split(/<eor>\s*/i);

for(let i = 0; i < registros.length; i++){

    const r = registros[i];

    if(!r.trim()) continue;
		
        // EXTRAER CAMPOS

        const STATION_CALLSIGN =
		extraerCampo(r,'STATION_CALLSIGN');
		
		const call =
        extraerCampo(r,'CALL');
		
		const COMMENT =
		extraerCampo(r,'COMMENT');
  
		console.log(
		`Enviando ${i+1}/${registros.length} -> ${call}`
		);
	
		// =========================
		//    EXTRAE EMAIL QRZ
		// =========================

		const emailQRZ =
		await buscarEmailQRZ(call);

		console.log(
		"CALL:",
		call,
		"EMAIL:",
		emailQRZ
		);
        
		const fecha =
        extraerCampo(r,'QSO_DATE');

        const hora =
        extraerCampo(r,'TIME_ON');

        const banda =
        extraerCampo(r,'FREQ');

        let modo =
		extraerCampo(r,'MODE');

		// NORMALIZAR MODOS

		const modoUpper = modo.trim().toUpperCase();

		if(
		modoUpper === 'DIGITALVOICE' ||
		modoUpper === 'DVOICE' ||
		modoUpper === 'DV'
		){
		modo = 'DVOICE';
		}

        const rst =
        extraerCampo(r,'RST_SENT');

        // FECHA

        let year = '';
        let month = '';
        let day = '';

        if(fecha.length === 8){

            year = fecha.substring(0,4);

            month = fecha.substring(4,6);

            day = fecha.substring(6,8);
        }

        // HORA

        let utc = hora;

        if(hora.length >= 4){

            utc =
            hora.substring(0,2)
            + ':'
            + hora.substring(2,4);
        }

        // RELLENAR FORMULARIO
        
		document.getElementById('STATION_CALLSIGN').value = STATION_CALLSIGN;
		
		document.getElementById('COMMENT').value = COMMENT;
		
		document.getElementById('qso').value = call;

        document.getElementById('day').value = day;

        document.getElementById('month').value = month;

        document.getElementById('year').value = year;

        document.getElementById('utc').value = utc;

        document.getElementById('mhz').value = banda;

        document.getElementById('modo').value = modo;

        document.getElementById('rst').value = rst;

        document.getElementById('qsl').value = 'PSE';

// GENERAR

		generar();

// =========================
//   ENVIAR QSL AUTOMÁTICA
// =========================

		if(emailQRZ){

		try{

        const token =
        localStorage.getItem(
            'gmail_access_token'
        );

        const imagen =
        canvas.toDataURL("image/png");

        const response =
        await fetch(
            '/.netlify/functions/send-qsl',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                    'application/json'
                },

                body:JSON.stringify({

                    token:token,

                    to:emailQRZ,

                    image:imagen
                })
            }
        );

        const resultado =
        await response.json();

		if(resultado.gmailResponse?.includes('"error"')){
	    console.log(
        'Error Gmail:',
        resultado.gmailResponse
    	);

    	continue;
		}
			
        console.log(
            'QSL enviada:',
            resultado
        );

        actualizarContadorQSL();

		}catch(error){

        console.log(
            'Error enviando:',
            error
        );
		}
		}else{

		console.log(
        'QRZ sin email:',
        call
		);
		}

// DESCARGA LOCAL (pausada por ahora)

	//	descargarAutomatica(
	//	call + "_" + fecha
	//	);

// ESPERA

		await esperar(1000);
	}
    
    actualizarContadorQSL(true);
    alert("Proceso terminado");
}

// =====================================

// =====================================

// DÍA

const daySelect =
document.getElementById('day');

for(let i = 1; i <= 31; i++){

// =====================================
//         EXTRAER CAMPOS ADIF
// =====================================

function extraerCampo(texto,campo){

    const regex =
    new RegExp(
        `<${campo}:(\\d+)[^>]*>([^<]+)`,
        'i'
    );

    const match = texto.match(regex);

    if(match){

        return match[2].trim();
    }

    return '';
}

// =====================================
//         DESCARGA AUTOMÁTICA
// =====================================

function descargarAutomatica(nombre){

    const link =
    document.createElement('a');

    link.download = nombre + '.png';

    link.href =
    canvas.toDataURL("image/png");

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}

// =====================================
// ENVÍO MANUAL consultando email de QRZ
// =====================================

async function enviarQSLPrueba(){

    try{

        // TOKEN GMAIL

        const token =
        localStorage.getItem(
            'gmail_access_token'
        );

        if(!token){

            alert(
                'Primero conectá Gmail'
            );

            return;
        }

        // CALLSIGN DESDE FORMULARIO

        const callsign =
        document.getElementById('qso').value.trim();

        if(!callsign){

            alert(
                'Ingrese un Callsign'
            );

            return;
        }

        // BUSCAR EMAIL EN QRZ

        const emailQRZ =
        await buscarEmailQRZ(callsign);

        if(!emailQRZ){

            alert(
                'QRZ no posee email para ' + callsign
            );

            return;
        }

        console.log(
            'EMAIL QRZ:',
            emailQRZ
        );

        // IMAGEN QSL

        const imagen =
        canvas.toDataURL("image/png");

        // ENVIAR

        const response =
        await fetch(
            '/.netlify/functions/send-qsl',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                    'application/json'
                },

                body:JSON.stringify({

                    token:token,

                    to:emailQRZ,

                    image:imagen
                })
            }
        );

        const data =
		await response.json();

		if(
		data.gmailResponse?.includes(
		'"UNAUTHENTICATED"'
		)
		){

    	console.log(
    	'Token vencido, renovando...'
    	);

    	const nuevoToken =
    	await renovarToken();

    	if(nuevoToken){

        console.log(
        'Token renovado'
        );

    	}else{

        alert(
        'Debe volver a conectar Gmail'
        );
    	}
		}
		
		console.log(
    	'QSL enviada:',
    	data
		);

		actualizarContadorQSL();
		actualizarContadorQSL(true);

		alert(
    	'QSL enviada a: ' + emailQRZ
		);

    }catch(error){

        console.log(error);

        alert(
            'Error enviando'
        );
    }
}

// =====================================

function esperar(ms){

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

// ===========================
//  Renovar el Token de Gmail
// ===========================

async function renovarToken(){

    const refreshToken =
    localStorage.getItem(
        'gmail_refresh_token'
    );

    if(!refreshToken){

        alert(
            'Debe volver a conectar Gmail'
        );

        return null;
    }

    const response =
    await fetch(
        '/.netlify/functions/refresh-token',
        {
            method:'POST',

            headers:{
                'Content-Type':
                'application/json'
            },

            body:JSON.stringify({

                refresh_token:
                refreshToken
            })
        }
    );

    const data =
    await response.json();

    if(data.access_token){

        localStorage.setItem(
            'gmail_access_token',
            data.access_token
        );

        return data.access_token;
    }

    return null;
}
